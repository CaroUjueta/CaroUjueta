<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#3a1c71"/>
      <stop offset="75%" stop-color="#6e40c9"/>
      <stop offset="100%" stop-color="#ff79c6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- estrellitas dispersas, cada una parpadea con su propio ritmo -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="60" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="20" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="80" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="120" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="160" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.9s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="150" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.1s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="170" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.7s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="20" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="90" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="130" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="160" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="150" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="30" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="170" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="25" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="15" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="180" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="185" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.3s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- estrellas grandes de 4 puntas: parpadean y "respiran" (escalan) -->
  <g fill="#e6ccff" filter="url(#glow)">
    <path d="M105 45 L110 55 L120 58 L110 61 L105 71 L100 61 L90 58 L100 55 Z">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" additive="sum" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M790 100 L794 108 L802 111 L794 114 L790 122 L786 114 L778 111 L786 108 Z">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" additive="sum" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M55 90 L58 96 L64 98 L58 100 L55 106 L52 100 L46 98 L52 96 Z">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" additive="sum" dur="2.1s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M840 55 L843 61 L849 63 L843 65 L840 71 L837 65 L831 63 L837 61 Z">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" additive="sum" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M200 130 L203 136 L209 138 L203 140 L200 146 L197 140 L191 138 L197 136 Z">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" additive="sum" dur="2.3s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M710 140 L713 146 L719 148 L713 150 L710 156 L707 150 L701 148 L707 146 Z">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" additive="sum" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- texto principal, sin emojis -->
  <text x="450" y="100" font-family="Verdana, Arial, sans-serif" font-size="46" font-weight="bold"
        fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    Caro Ujueta
  </text>

  <!-- subtítulo -->
  <text x="450" y="135" font-family="Verdana, Arial, sans-serif" font-size="17"
        fill="#e6ccff" text-anchor="middle" opacity="0.9">
    Estudiante de Ingeniería de Sistemas | Software Developer
  </text>
</svg>
